<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="120" viewBox="0 0 800 120" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient matching GitHub Dark Mode -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    
    <!-- Meteor Tail Gradient -->
    <linearGradient id="meteorTail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 1)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </linearGradient>

    <!-- Star Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      /* Twinkling background stars */
      .star { 
        fill: #ffffff; 
        animation: twinkle linear infinite; 
      }
      @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 0.2; transform: scale(0.8); }
      }

      /* Meteor animation */
      .meteor-container {
        opacity: 0;
        animation: meteorFall linear infinite;
      }
      .meteor-head {
        fill: #ffffff;
        filter: url(#glow);
      }
      .meteor-tail {
        stroke: url(#meteorTail);
        stroke-width: 2;
        stroke-linecap: round;
      }

      @keyframes meteorFall {
        0% {
          transform: translate(900px, -100px) rotate(-35deg);
          opacity: 1;
        }
        15% {
          transform: translate(-100px, 600px) rotate(-35deg);
          opacity: 0;
        }
        100% {
          transform: translate(-100px, 600px) rotate(-35deg);
          opacity: 0;
        }
      }

      /* Delays for different meteors */
      .m1 { animation-duration: 4s; animation-delay: 0s; }
      .m2 { animation-duration: 5s; animation-delay: 1.5s; }
      .m3 { animation-duration: 3.5s; animation-delay: 2.8s; }
      .m4 { animation-duration: 6s; animation-delay: 4.2s; }
      .m5 { animation-duration: 4.5s; animation-delay: 3.1s; }

      /* Footer text styling */
      .footer-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 13px;
        fill: #8b949e;
        letter-spacing: 3px;
        font-weight: 500;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="10" />

  <!-- Static/Twinkling Stars -->
  <g opacity="0.8">
    <!-- Generating a scattering of stars with varying sizes and animation delays -->
    <circle cx="45" cy="23" r="1" class="star" style="animation-duration: 3s; animation-delay: 0.5s;"/>
    <circle cx="120" cy="85" r="1.5" class="star" style="animation-duration: 2s; animation-delay: 1s;"/>
    <circle cx="210" cy="15" r="1" class="star" style="animation-duration: 4s; animation-delay: 0.2s;"/>
    <circle cx="340" cy="65" r="2" class="star" style="animation-duration: 3.5s; animation-delay: 1.5s;"/>
    <circle cx="480" cy="20" r="1" class="star" style="animation-duration: 2.5s; animation-delay: 0.8s;"/>
    <circle cx="560" cy="95" r="1.5" class="star" style="animation-duration: 3s; animation-delay: 2s;"/>
    <circle cx="670" cy="35" r="1" class="star" style="animation-duration: 4.5s; animation-delay: 0.1s;"/>
    <circle cx="750" cy="75" r="2" class="star" style="animation-duration: 2s; animation-delay: 1.2s;"/>
    <circle cx="85" cy="105" r="1" class="star" style="animation-duration: 3s; animation-delay: 2.5s;"/>
    <circle cx="290" cy="110" r="1.5" class="star" style="animation-duration: 4s; animation-delay: 0.7s;"/>
    <circle cx="410" cy="90" r="1" class="star" style="animation-duration: 2s; animation-delay: 1.8s;"/>
    <circle cx="620" cy="110" r="1.5" class="star" style="animation-duration: 3.5s; animation-delay: 0.4s;"/>
  </g>

  <!-- Meteors -->
  <!-- Meteor template: tail extending to the right, moving left -->
  <!-- Since it's rotated -35deg, we place them at 0,0 within their group, and the keyframes handle the motion from top-right to bottom-left -->
  <g class="meteor-container m1">
    <line x1="0" y1="0" x2="100" y2="0" class="meteor-tail" />
    <circle cx="0" cy="0" r="1.5" class="meteor-head" />
  </g>

  <!-- Offset their starting positions using translate before the animation? 
       Wait, the animation overrides transform. So we need to put the animation on an inner element or adjust the path.
       Better: wrap in another g to set initial offset. -->
  <g transform="translate(100, -50)"><g class="meteor-container m2">
    <line x1="0" y1="0" x2="80" y2="0" class="meteor-tail" />
    <circle cx="0" cy="0" r="1" class="meteor-head" />
  </g></g>
  
  <g transform="translate(-200, -20)"><g class="meteor-container m3">
    <line x1="0" y1="0" x2="150" y2="0" class="meteor-tail" />
    <circle cx="0" cy="0" r="2" class="meteor-head" />
  </g></g>

  <g transform="translate(300, 30)"><g class="meteor-container m4">
    <line x1="0" y1="0" x2="60" y2="0" class="meteor-tail" />
    <circle cx="0" cy="0" r="1" class="meteor-head" />
  </g></g>

  <g transform="translate(-150, 40)"><g class="meteor-container m5">
    <line x1="0" y1="0" x2="120" y2="0" class="meteor-tail" />
    <circle cx="0" cy="0" r="1.5" class="meteor-head" />
  </g></g>

  <!-- Center Text -->
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" class="footer-text">
    ✧ Thank you for stopping by ✧
  </text>
</svg>
