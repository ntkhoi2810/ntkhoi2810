  *<!-- scattered coordinate labels / equations, background texture -->*

  <g fill="#334155">

    <text x="46" y="38" class="math" font-size="11" opacity="0.28">10<tspan baseline-shift="super" font-size="7.5">−9</tspan><tspan class="roman"> m</tspan></text>

    <text x="46" y="54" class="math" font-size="11" opacity="0.22"><tspan class="var">σ</tspan> = 0.014</text>

    <text x="140" y="298" class="math" font-size="11" opacity="0.20">Δ<tspan class="var">x</tspan> · Δ<tspan class="var">p</tspan> ≥ ℏ⁄2</text>

    <text x="905" y="40" class="math" font-size="12" opacity="0.30"><tspan class="var">E</tspan> = <tspan class="var">m</tspan><tspan class="var">c</tspan><tspan baseline-shift="super" font-size="8">2</tspan></text>

    <text x="1040" y="286" class="math" font-size="11" opacity="0.24"><tspan class="var">ψ</tspan>(<tspan class="var">x</tspan>, <tspan class="var">t</tspan>)</text>

    <text x="360" y="46" class="math" font-size="11" opacity="0.22">∇ · Σ</text>

    <text x="520" y="300" class="math" font-size="11" opacity="0.20"><tspan class="var">λ</tspan> = 632.8<tspan class="roman"> nm</tspan></text>

    <text x="860" y="230" class="math roman" font-size="11" opacity="0.22">GeV</text>

    <text x="720" y="60" class="math" font-size="12" opacity="0.26"><tspan class="var">φ</tspan>, <tspan class="var">μ</tspan>, <tspan class="var">τ</tspan></text>

    <text x="200" y="120" class="sci-mono" font-size="10" opacity="0.18">01001 10110</text>

    <text x="1100" y="60" class="math" font-size="10" opacity="0.18">Δ<tspan class="var">E</tspan> · Δ<tspan class="var">t</tspan> ≈ ℏ</text>

