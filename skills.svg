<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="896" height="380" viewBox="0 0 896 380" fill="none" role="img" aria-labelledby="title description">
  <title id="title">AI Research — Skill Atom</title>
  <desc id="description">Python, NumPy, PyTorch, TensorFlow, Scikit-Learn, Deep Learning, Representation Learning and Knowledge Graph orbit an AI Research nucleus on three intersecting elliptical tracks.</desc>

  <style>
    :root {
      --core: #6d28d9;
      --core-light: #a78bfa;
      --surface: #ffffff;
      --track: #94a3b8;
      --muted: #64748b;
      --python: #0284c7;
      --numpy: #64748b;
      --pytorch: #e11d48;
      --tensorflow: #ea580c;
      --scikit: #a16207;
      --deep: #b45309;
      --representation: #0d9488;
      --knowledge: #4f46e5;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --core: #c4b5fd;
        --core-light: #8b5cf6;
        --surface: #0d1117;
        --track: #64748b;
        --muted: #94a3b8;
        --python: #38bdf8;
        --numpy: #cbd5e1;
        --pytorch: #fb7185;
        --tensorflow: #fb923c;
        --scikit: #fef08a;
        --deep: #fcd34d;
        --representation: #5eead4;
        --knowledge: #a5b4fc;
      }
    }
    .track { stroke: var(--track); stroke-width: 1; opacity: .35; }
    .track-accent { stroke: var(--core-light); stroke-width: 1.5; stroke-dasharray: 3 13; opacity: .35; }
    .skill { font: 600 11px var(--font-mono); fill: currentColor; }
    .skill text {
      text-anchor: middle;
      paint-order: stroke fill;
      stroke: var(--surface);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .electron-halo { fill: currentColor; opacity: .12; }
    .electron { fill: currentColor; stroke: var(--surface); stroke-width: 1.5; }
    .python { color: var(--python); }
    .numpy { color: var(--numpy); }
    .pytorch { color: var(--pytorch); }
    .tensorflow { color: var(--tensorflow); }
    .scikit { color: var(--scikit); }
    .deep { color: var(--deep); }
    .representation { color: var(--representation); }
    .knowledge { color: var(--knowledge); }
    .core-ring {
      stroke: var(--core-light);
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 5s ease-in-out infinite;
    }
    .core-title { fill: var(--core); font: 700 14px var(--font-mono); text-anchor: middle; }
    .caption { fill: var(--muted); font: 9px var(--font-mono); letter-spacing: .2em; text-anchor: middle; }
    .static-skills { display: none; }
    @keyframes pulse {
      0%, 100% { transform: scale(.95); opacity: .35; }
      50% { transform: scale(1.1); opacity: .12; }
    }
    @media (prefers-reduced-motion: reduce) {
      .core-ring { animation: none; opacity: .3; }
      .moving-skills { display: none; }
      .static-skills { display: inline; }
    }
  </style>

  <defs>
    <!-- All electrons share the exact geometry of their visible orbit. -->
    <path id="orbit" d="M 270 0 A 270 74 0 1 1 -270 0 A 270 74 0 1 1 270 0"/>
    <radialGradient id="nucleus-glow">
      <stop stop-color="var(--core-light)" stop-opacity=".2"/>
      <stop offset="1" stop-color="var(--core-light)" stop-opacity="0"/>
    </radialGradient>
    <g id="electron">
      <circle r="10" class="electron-halo"/>
      <circle r="4" class="electron"/>
    </g>
    <g id="python" class="skill python"><use xlink:href="#electron"/><text y="-15">Python</text></g>
    <g id="numpy" class="skill numpy"><use xlink:href="#electron"/><text y="-15">NumPy</text></g>
    <g id="pytorch" class="skill pytorch"><use xlink:href="#electron"/><text y="-15">PyTorch</text></g>
    <g id="tensorflow" class="skill tensorflow"><use xlink:href="#electron"/><text y="-15">TensorFlow</text></g>
    <g id="scikit" class="skill scikit"><use xlink:href="#electron"/><text y="-15">Scikit-Learn</text></g>
    <g id="deep" class="skill deep"><use xlink:href="#electron"/><text y="-15">Deep Learning</text></g>
    <g id="representation" class="skill representation"><use xlink:href="#electron"/><text y="-15">Representation Learning</text></g>
    <g id="knowledge" class="skill knowledge"><use xlink:href="#electron"/><text y="-15">Knowledge Graph</text></g>
  </defs>

  <!-- Three intersecting orbital planes, centered on the research nucleus. -->
  <g transform="translate(448 190)">
    <circle r="100" fill="url(#nucleus-glow)"/>
    <g class="track">
      <use xlink:href="#orbit"/>
      <use xlink:href="#orbit" transform="rotate(30)"/>
      <use xlink:href="#orbit" transform="rotate(-30)"/>
    </g>
    <use xlink:href="#orbit" transform="rotate(30)" class="track-accent"/>

    <!-- A compact nucleus masks the tracks beneath its typography. -->
    <circle r="63" class="core-ring"/>
    <circle r="54" fill="var(--surface)" stroke="var(--core-light)" stroke-opacity=".45"/>
    <circle r="49" fill="url(#nucleus-glow)"/>
    <g fill="var(--core-light)">
      <circle cx="-9" cy="-28" r="3" opacity=".6"/>
      <circle cy="-31" r="4" opacity=".9"/>
      <circle cx="9" cy="-28" r="3" opacity=".6"/>
    </g>
    <text class="core-title" y="-4">AI</text>
    <text class="core-title" y="15">Research</text>
    <text class="caption" y="34" style="font-size: 7px">NUCLEUS</text>

    <!-- Counter-rotation keeps labels horizontal on the tilted planes. -->
    <g class="moving-skills">
      <g>
        <g><animateMotion dur="24s" begin="-2s" repeatCount="indefinite"><mpath xlink:href="#orbit"/></animateMotion><use xlink:href="#python"/></g>
        <g><animateMotion dur="24s" begin="-10s" repeatCount="indefinite"><mpath xlink:href="#orbit"/></animateMotion><use xlink:href="#numpy"/></g>
        <g><animateMotion dur="24s" begin="-18s" repeatCount="indefinite"><mpath xlink:href="#orbit"/></animateMotion><use xlink:href="#scikit"/></g>
      </g>
      <g transform="rotate(30)">
        <g><animateMotion dur="32s" begin="-1s" repeatCount="indefinite"><mpath xlink:href="#orbit"/></animateMotion><use xlink:href="#pytorch" transform="rotate(-30)"/></g>
        <g><animateMotion dur="32s" begin="-11.6667s" repeatCount="indefinite"><mpath xlink:href="#orbit"/></animateMotion><use xlink:href="#tensorflow" transform="rotate(-30)"/></g>
        <g><animateMotion dur="32s" begin="-22.3333s" repeatCount="indefinite"><mpath xlink:href="#orbit"/></animateMotion><use xlink:href="#deep" transform="rotate(-30)"/></g>
      </g>
      <g transform="rotate(-30)">
        <g><animateMotion dur="40s" begin="-5s" repeatCount="indefinite"><mpath xlink:href="#orbit"/></animateMotion><use xlink:href="#representation" transform="rotate(30)"/></g>
        <g><animateMotion dur="40s" begin="-25s" repeatCount="indefinite"><mpath xlink:href="#orbit"/></animateMotion><use xlink:href="#knowledge" transform="rotate(30)"/></g>
      </g>
    </g>

    <!-- A readable still composition when the viewer requests less motion. -->
    <g class="static-skills">
      <use xlink:href="#python" x="270"/>
      <use xlink:href="#numpy" x="-270"/>
      <use xlink:href="#scikit" y="-74"/>
      <use xlink:href="#pytorch" x="234" y="135"/>
      <use xlink:href="#tensorflow" x="-234" y="-135"/>
      <use xlink:href="#deep" x="-37" y="64"/>
      <use xlink:href="#representation" x="234" y="-135"/>
      <use xlink:href="#knowledge" x="-234" y="135"/>
    </g>
  </g>
</svg>
